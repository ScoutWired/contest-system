{% extends "admin/base.html" %}{% block admin %}
<div class="card"><h2>Audit log</h2>
<table><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>
{% for e in events %}<tr><td>{{ e.created_at }}</td><td>{{ e.actor_id[:8] }}</td><td>{{ e.action }}</td><td>{{ e.target }}</td><td>{{ e.detail[:120] }}</td></tr>{% endfor %}</table></div>
{% endblock %}
